name: Verify catalog-only addon

on:
  push:
    paths:
      - 'addon/**'
      - 'catalogs-source.json'
      - 'lib/**'
      - 'tools/**'
      - 'tests/**'
      - 'worker.js'
      - '.github/workflows/diag.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild without network dependencies
        run: node tools/refresh.mjs
      - name: Verify catalog and no-playback contract
        run: node --test tests/catalog-only.test.mjs
      - name: Check committed catalogs are current
        run: git diff --exit-code -- addon/
